services:
  # ==========================================
  # Service 1: Backend API (Node.js Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nara-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DISCORD_BOT_WEBHOOK_URL=${DISCORD_BOT_WEBHOOK_URL:-http://bot:5002/webhook/delivery}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nara-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Service 2: Frontend & Reverse Proxy (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: nara-frontend
    restart: unless-stopped
    ports:
      # Port host yang diexpose (default 80, bisa disesuaikan via .env PORT=80)
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nara-network

  # ==========================================
  # Service 3: Bot Discord (Node.js + discord.js)
  # ==========================================
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: nara-discord-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5001/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nara-network

  # ==========================================
  # Service 4: Redis (Ultra-Lightweight Queue for STB, ~15-25MB RAM)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: nara-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --appendonly no --save ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - nara-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # Service 5: PostgreSQL Lokal (Opsional)
  # Diaktifkan hanya jika ingin menggunakan database lokal di VPS
  # daripada Supabase Cloud (Jalankan: docker compose --profile db up -d)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: nara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nara_digital}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nara-network
    profiles:
      - db

networks:
  nara-network:
    driver: bridge
    name: nara-network

volumes:
  postgres_data:
    driver: local
